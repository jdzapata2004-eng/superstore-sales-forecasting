services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Montamos la carpeta mlruns para que la API pueda leer el modelo @champion
      - ./mlruns:/app/mlruns
      # Montamos data para que pueda leer el CSV
      - ./data:/app/data
    environment:
      - MLFLOW_TRACKING_URI=file:///app/mlruns
    depends_on:
      - mlflow

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns