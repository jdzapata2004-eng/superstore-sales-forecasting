[project]
name = "superstore-sales-forecasting"
version = "0.1.0"
description = "Pronóstico mensual de ventas de Superstore"
requires-python = ">=3.11,<3.15"
dependencies = [
    "kagglehub==1.0.3",
    "matplotlib>=3.9",
    "mlflow>=3.5,<4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/superstore_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
